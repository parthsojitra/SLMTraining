# Training configuration for Qwen fine-tuning on Indian SMS data
model:
  model_id: "Qwen/Qwen3.5-2B"
  alternative_models:
    - "Qwen/Qwen2.5-1.5B-Instruct"
    - "Qwen/Qwen2.5-3B-Instruct"
    - "Qwen/Qwen2.5-0.5B-Instruct"
  trust_remote_code: true
  use_4bit: false       # Set true for QLoRA on CUDA
  use_8bit: false

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_length: 256
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 50
  save_total_limit: 2
  output_dir: "./output/qwen-sms-lora"
  versioned: true
  description: "Baseline Qwen3.5-2B LoRA run on Indian SMS corpus"
  # Warm-start new version from an existing LoRA adapter (e.g. "./output/qwen-sms-lora/latest")
  init_adapter_path: null
  # Exact mid-run resume from a trainer checkpoint dir (e.g. "./output/qwen-sms-lora/checkpoint-125")
  resume_from_checkpoint: null
